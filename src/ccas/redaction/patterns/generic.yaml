# Global regex patterns. Domain packs layer their own on top; they never remove these.
#
# Ordering note: the pipeline resolves overlaps by score then length, so a precise
# pattern with a checksum (payment_card) wins over a broad one (long_digit_run) that
# matched the same text.
patterns:
  # --- identifiers with checksums -------------------------------------------
  - name: payment_card
    pattern: '\b(?:\d[ -]?){12,18}\d\b'
    entity_type: payment_card
    score: 0.99
    validator_name: luhn

  - name: iban
    pattern: '\b[A-Z]{2}\d{2}[ ]?(?:[A-Z0-9]{4}[ ]?){2,7}[A-Z0-9]{1,4}\b'
    entity_type: iban
    score: 0.99
    validator_name: iban_mod97

  - name: bank_routing
    pattern: '\b\d{9}\b'
    entity_type: bank_account
    score: 0.72
    validator_name: aba_routing

  # --- national identifiers --------------------------------------------------
  - name: national_id_us
    pattern: '\b(?!000|666|9\d{2})\d{3}[- ](?!00)\d{2}[- ](?!0000)\d{4}\b'
    entity_type: national_id
    score: 0.98

  - name: national_id_uk
    pattern: '\b[A-CEGHJ-PR-TW-Z]{2}[ ]?\d{2}[ ]?\d{2}[ ]?\d{2}[ ]?[A-D]\b'
    entity_type: national_id
    score: 0.95

  - name: national_id_12_digit
    pattern: '\b\d{4}[ ]?\d{4}[ ]?\d{4}\b'
    entity_type: national_id
    score: 0.60

  # --- contact ---------------------------------------------------------------
  - name: email
    pattern: '\b[A-Za-z0-9._%+\-]+@[A-Za-z0-9.\-]+\.[A-Za-z]{2,}\b'
    entity_type: email
    score: 0.99

  - name: phone_e164
    pattern: '\+\d{1,3}[ \-.]?\(?\d{1,4}\)?[ \-.]?\d{2,4}[ \-.]?\d{2,4}(?:[ \-.]?\d{2,4})?'
    entity_type: phone
    score: 0.95

  - name: phone_na
    pattern: '\b\(?\d{3}\)?[ \-.]\d{3}[ \-.]\d{4}\b'
    entity_type: phone
    score: 0.93

  - name: url
    pattern: '\bhttps?://[^\s<>"]+'
    entity_type: url
    score: 0.95

  - name: ipv4
    pattern: '\b(?:(?:25[0-5]|2[0-4]\d|1\d{2}|[1-9]?\d)\.){3}(?:25[0-5]|2[0-4]\d|1\d{2}|[1-9]?\d)\b'
    entity_type: ip
    score: 0.97

  # --- temporal --------------------------------------------------------------
  # Context-anchored, because a bare date is far more often an appointment than a
  # birth date, and over-redaction makes transcripts unreadable for human agents.
  - name: date_of_birth_labelled
    pattern: '(?i)\b(?:date of birth|d\.?o\.?b\.?|born on|birth ?date)\b[^\n]{0,16}?\b\d{1,4}[-/. ]\d{1,2}[-/. ]\d{2,4}\b'
    entity_type: date_of_birth
    score: 0.97

  # Scored below the default min_score (0.5) so it is inert unless an operator
  # deliberately lowers the threshold. A bare date is overwhelmingly an ETA, an
  # appointment or an order date; redacting all of them turned a delivery ETA into
  # [DATE_OF_BIRTH_1] and made tool output unreadable. A vertical that genuinely needs
  # every date removed lowers min_score in its policy, or adds a stricter pack pattern.
  - name: date_numeric
    pattern: '\b(?:19|20)\d{2}[-/]\d{1,2}[-/]\d{1,2}\b|\b\d{1,2}[-/]\d{1,2}[-/](?:19|20)\d{2}\b'
    entity_type: date_of_birth
    score: 0.40

  # --- secrets ---------------------------------------------------------------
  - name: credential_labelled
    pattern: '(?i)\b(?:pin|otp|passcode|password|security code|one[- ]time code|verification code)\b(?:\W{0,6}(?:is|are|was))?\W{0,6}\d{3,10}\b'
    entity_type: credential
    score: 0.98

  - name: cvv_labelled
    pattern: '(?i)\b(?:cvv|cvc|security number|card code)\b(?:\W{0,6}(?:is|are|was))?\W{0,6}\d{3,4}\b'
    entity_type: credential
    score: 0.98

  # --- names -----------------------------------------------------------------
  # Context-anchored, so it runs at regex speed on the realtime path where full NER
  # does not fit. Self-identification is where a caller's name actually appears; this
  # does NOT replace batch NER, which still runs before anything is stored.
  - name: person_name_self_id
    pattern: '(?:(?i:my name(?:''s| is)|this is|i am|i''m|speaking(?: with)?|you''re speaking (?:to|with)|it''s))\s+([A-Z][a-z]{1,20}(?:\s+[A-Z][a-z]{1,20}){0,2})'
    entity_type: person
    score: 0.85
    capture_group: 1

  # --- postal ----------------------------------------------------------------
  - name: postcode_uk
    pattern: '\b[A-Z]{1,2}\d[A-Z\d]?[ ]?\d[A-Z]{2}\b'
    entity_type: address
    score: 0.90

  - name: zip_us_plus4
    pattern: '\b\d{5}-\d{4}\b'
    entity_type: address
    score: 0.88

# Patterns re-run after substitution. A hit here means something slipped through, and
# the report becomes DIRTY -- egress blocked. Keep this list to high-precision rules
# only: a false positive here fails a call that was actually clean.
leak_detection:
  - payment_card
  - iban
  - national_id_us
  - national_id_uk
  - email
  - phone_e164
  - phone_na
  - credential_labelled
  - cvv_labelled
